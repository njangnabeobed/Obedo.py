const L="ABCD",$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let set=[],name="",end=0,iv=0,done=false;
const rnd=n=>Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*n);
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){let seen=[];try{seen=JSON.parse(localStorage.getItem("fdp")||"[]")}catch(e){}
 let un=D.map((_,i)=>i).filter(i=>!seen.includes(i));if(un.length<N){seen=[];un=D.map((_,i)=>i)}
 const ch=shuf(un).slice(0,N);try{localStorage.setItem("fdp",JSON.stringify(seen.concat(ch)))}catch(e){}return ch}

 $("start").classList.add("hide");$("res").classList.add("hide");$("qz").classList.remove("hide");upd();

let rows=[],best=false;

function tview(msg){const t=$("teacher");let r=rows.slice();
